[package]
name = "pulse-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "pulse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
pulse-core = { version = "0.1.0", path = "../core" }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = "3.5.0"
url = "2.5.8"
